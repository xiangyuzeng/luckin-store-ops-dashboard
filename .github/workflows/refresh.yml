name: refresh-payload

# Daily refresh of data/payload.json. Runs at 09:00 UTC (~05:00 ET, off-peak).
# Also exposed as workflow_dispatch for manual reruns.
#
# Path A — self-hosted runner inside the internal network with MySQL access.
# Path B — internal cron calling pipeline/refresh.sh against mcp-db-gateway (no GH Actions).
# Path C — scheduled Claude Code agent committing the payload directly.
#
# If the runs-on tag below has no matching runner, the job is skipped — Vercel deploys
# from the committed payload regardless of whether this workflow ever runs.

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    # The "self-hosted" tag is the network-bridged runner; replace with "luckin-internal"
    # or similar label once the runner is provisioned.
    runs-on: [self-hosted, luckin-internal]
    env:
      AWS_REGION: us-east-1
      MYSQL_SECRET_NAME: ${{ secrets.MYSQL_SECRET_NAME }}
      RETAIN_DAYS: '40'
      HALF_HOUR_RETAIN_DAYS: '3'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pipeline deps
        run: pip install -r pipeline/requirements.txt

      - name: Configure git identity
        run: |
          git config user.name  "luckin-dashboard-bot"
          git config user.email "dashboard-bot@noreply.luckincoffeena.com"

      - name: Run refresh
        run: bash pipeline/refresh.sh

      # Vercel rebuilds automatically on push of data/payload.json — no additional step needed.
