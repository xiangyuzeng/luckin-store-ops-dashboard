name: refresh-payload

# Manual-only fallback path. The canonical refresh runs in Docker on an
# internal host (see pipeline/docker-compose.yml), driven by APScheduler
# at 09:00 UTC. This workflow stays as workflow_dispatch only — its
# scheduled trigger was disabled to avoid daily failures, since the
# self-hosted runner with MySQL VPC reach is not currently provisioned.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    # The "self-hosted" tag is the network-bridged runner; replace with "luckin-internal"
    # or similar label once the runner is provisioned.
    runs-on: [self-hosted, luckin-internal]
    env:
      AWS_REGION: us-east-1
      MYSQL_SECRET_NAME: ${{ secrets.MYSQL_SECRET_NAME }}
      RETAIN_DAYS: '90'
      HALF_HOUR_RETAIN_DAYS: '3'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pipeline deps
        run: pip install -r pipeline/requirements.txt

      - name: Configure git identity
        run: |
          git config user.name  "luckin-dashboard-bot"
          git config user.email "dashboard-bot@noreply.luckincoffeena.com"

      - name: Run refresh
        run: bash pipeline/refresh.sh

      # Vercel rebuilds automatically on push of data/payload.json — no additional step needed.
